[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multilingual-safety-framework"
version = "0.1.0"
description = "A multilingual and code-mixed safety evaluation and mitigation framework for LLMs across English, Hindi, Hinglish, and Bhojpuri."
authors = [{ name = "Harshit Pranjal" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=2.2.0",
    "indic-transliteration>=2.3.0",
    "datasets>=2.14.0",
    "openai>=1.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
multisafe = "src.cli:app"

